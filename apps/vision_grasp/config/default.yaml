# =====================================================================
# 手眼标定 + YOLO 抓取 统一配置
# 眼在手上（eye-in-hand）：D435i 刚性固定在末端，ArUco 标记固定在工作台。
# 单位约定：关节角=度，长度=米，像素=px。
# 采集点位：填写 ready/safe 与 8~50 个采集点（不留空槽位），
# 且 max_pose_attempts <= 已填数量。
# =====================================================================

board:                       # --- 标记板（单 ArUco，或 ChArUco 棋盘做对比实验） ---
  kind: aruco                # aruco（默认，单标记）| charuco（棋盘；产出文件名自动加
                             #   _charuco 后缀，与单 ArUco 结果互不覆盖）
  type: aruco_single
  dictionary: DICT_4X4_50    # 两种板共用的 ArUco 字典
  marker_id: 0               # 单 ArUco 用的标记 ID（charuco 忽略）
  marker_length_m: 0.098     # 单 ArUco：黑框外沿实测边长（不含白边！打印会缩放，务必实测）；
                             #   charuco：marker 边长 —— 切 kind 时同一键要跟着改！
  border_bits: 1             # 标记边框位宽
  min_side_px: 60            # 单 ArUco：图中标记最小边长，过小拒绝
  edge_margin_px: 10         # 单 ArUco：标记距图像边缘的最小余量
  max_reprojection_px: 1.0   # 两种板共用的 PnP 重投影误差上限（px）
  min_pnp_error_gap_px: 0.15 # 单 ArUco：IPPE 两解误差间隔下限（charuco 多角点天然消歧，不用）
  # --- ChArUco（kind: charuco 时生效；下面是手头板子的标称值，
  #     开测前用尺实测格边与 marker 边，按实测值改） ---
  squares_x: 5               # 横向格数
  squares_y: 5               # 纵向格数
  square_length_m: 0.030     # 格边长（m）；marker_length_m 用上面同一键，charuco 时填 0.022

robot:                       # --- 机械臂（d1t_sdk.D1Arm，DDS 直连 d1t_arm_ctrl） ---
  host: "dds"                # 占位：上层配置校验要求非空。连接由 CYCLONEDDS_URI
                             #   决定（source deploy/env.sh sim|real），适配层忽略本项
  port: 1                    # 占位，同上
  request_timeout_s: 5.0     # 等一帧 ArmState 的超时
  move_timeout_s: 45.0       # 单次运动到位超时
  vel_dps: 90.0              # 采集点之间的关节速度（°/s；控制器逐轴限速 100°/s）
  acc_dps2: 100.0             # 关节加速度（°/s²）
  approach_vel_dps: 40.0     # ready/safe 姿态的低速接近速度（°/s）
  offline_grace_s: 5.0       # 瞬时舵机掉线容忍窗：超窗才判故障；7/7 掉线立即判故障。
                             #   本控制器偶发缺回包沿用上次值、连续 200 ms 才判故障，
                             #   此判据留作冗余防线
  settle_s: 1.2              # 到位后的稳定窗时长（须覆盖多个遥测周期）
  poll_s: 0.1                # 到位轮询间隔
  arrival_tolerance_deg: 1.8 # 到位容差（含舵机死区；不代表 FK 精度）
  stable_tolerance_deg: 0.3  # 稳定窗内容许波动
  ready_pose_deg: [0.0,-40.0,40.0,0.0,40.0,0.0]   # 预备姿态（低速接近）
  safe_pose_deg: [0.0,-90.0,89.0,0.0,0.0,0.0]     # 安全姿态（收尾/异常退场；J2 用 89°，
                             #   实测限位 [-97,89]——原工程 90° 超上界 1°）
  poses_deg:                 # 采集点位（示教或手填；J5 正负两侧都要有）
    - [0.10, -20.30, 25.60, -5.20, 43.70, -4.00]
    - [-45.00, -22.70, 18.50, 31.40, 73.40, 48.90]
    - [-53.30, 20.60, 1.10, 40.10, 81.10, 80.90]
    - [-51.80, 39.10, -7.40, 44.90, 86.10, 78.00]
    - [47.30, 13.60, 14.20, -53.80, 70.80, -82.90]
    - [56.60, -18.40, 47.10, -53.30, 57.20, -87.60]
    - [62.50, 16.10, 12.70, -45.40, 77.60, -94.10]
    - [2.40, 17.00, -18.80, -6.10, 74.00, -8.40]
    - [-32.40, 28.70, -6.80, 36.80, 64.60, -0.40]
    - [-1.60, 34.70, -20.10, 2.00, 64.40, -14.30]
    - [32.00, 40.40, -20.00, -35.10, 76.00, -35.30]
    - [48.90, 19.50, 20.30, -52.10, 64.60, -35.30]
    - [27.60, 14.20, 12.80, 134.50, -52.40, -36.00]
    - [47.30, 18.40, 1.50, 133.80, -76.40, -34.20]
    - [42.40, -7.00, 32.30, 130.90, -54.20, -58.20]
    - [-52.60, 16.50, 29.20, 60.30, 60.00, -53.60]
    - [-56.80, 35.20, 3.50, 54.70, 85.20, -62.30]
    - [2.00, -0.50, 71.50, -1.70, -35.50, -0.70]
    - [28.10, 25.60, 4.70, -41.30, 54.40, -18.90]
    - [-0.40, -52.50, 31.60, 2.50, 55.40, 0.40]
    - [-0.30, -42.10, 35.70, 6.80, 48.30, 98.10]
    - [-6.20, -19.40, 36.00, 14.60, 25.80, -69.30]
    - [-53.20, 15.50, 19.00, 50.60, 62.80, -18.50]
    - [-57.40, 22.90, 7.50, 51.50, 73.30, -18.50]
    - [36.30, 1.10, 11.30, -36.70, 70.30, 52.70]
    - [20.60, -36.60, 22.30, -40.60, 56.30, -6.80]
    - [20.60, -63.40, 34.70, -30.20, 54.80, -5.40]
    - [-18.10, -18.40, -1.20, 15.00, 75.80, 0.50]
    - [51.70, 10.10, -0.10, -41.60, 75.30, -23.10]
    - [21.50, -5.80, 12.00, -26.30, 59.70, -32.40]
    - [21.50, -37.80, 20.00, -35.50, 66.60, -17.00]
    - [-36.00, -25.70, 20.00, 24.80, 62.30, 68.50]

camera:                      # --- RealSense 彩色流（标定/抓取共用） ---
  serial: ""                 # 多相机时填序列号；空=默认设备
  preview: true              # 采集过程显示带标注的预览窗（无显示环境自动禁用）
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 30          # 启动预热帧数（曝光稳定）
  frame_timeout_ms: 3000

collection:                  # --- 采集纪律 ---
  max_pose_attempts: 32      # 最多尝试的点位数（<= 已填数量）
  discard_frames: 5          # 稳定窗后丢弃的旧帧数
  capture_frames: 8          # 每点采集帧数
  min_detected_frames: 3     # 有效检测帧数下限
  max_marker_translation_spread_m: 0.004   # 多帧标记平移一致性上限
  max_marker_rotation_spread_deg: 2.0      # 多帧标记旋转一致性上限
  max_capture_drift_deg: 0.3  # 采图期间关节漂移上限（超差丢该点）
  min_pose_rotation_deg: 5.0 # 与已收样本的最小旋转差（去重）
  min_pose_translation_m: 0.015

quality:                     # --- 质量门（默认工程阈值，非精度承诺） ---
  method: PARK               # 手眼解法：PARK / TSAI / HORAUD
  min_samples: 15            # 最少有效样本数
  min_rotation_span_deg: 25.0    # 旋转跨度下限
  min_translation_span_m: 0.05   # 平移跨度下限
  min_axis_ratio: 0.15       # 相对旋转奇异值比下限（排除单轴退化采样）
  max_translation_rms_m: 0.006   # 平移 RMS 上限（按整机噪声地板标定：
                             #   舵机死区 FK 误差 + 平面标记弱深度轴 ~5mm@175°跨度）
  max_rotation_rms_deg: 2.0
  max_translation_error_m: 0.012  # 平移最大误差上限（同样用于留出验证）
  max_rotation_error_deg: 4.0
  solution_change_m: 0.003   # 早停：相邻解平移变化上限
  solution_change_deg: 1.0
  consecutive_passes: 3      # 早停：连续通过次数

output:                      # --- 产出（写入标定根目录，不是本配置目录） ---
  filename: hand_eye.npz     # 只有合格的求解才会覆盖旧结果
  session_dir: sessions      # 每次采集的图像/关节数据/样本留档目录

grasp:                       # --- YOLO 抓取（grasp_yolo / yolo_detect 使用） ---
  model: models/yoloe-26s-seg.pt   # 相对路径=标定根目录下；开放词表+分割
  device: auto               # auto=有 N 卡用 cuda:0，否则 cpu；也可直接填 cpu / cuda:0
  conf: 0.25                 # 开放词表分数偏低：球 ~0.85、瓶 ~0.48（0.5 会滤掉瓶子）
  iou: 0.45
  classes: ["squeeze ball", "stress ball", "water bottle", "bottle"]
                             # 检测白名单=yoloe 提示词（自由文本）。
                             # 物理目标=弹性握力球+矿泉水瓶。
                             # 注意：yoloe 下清空此表 => 不做 set_classes => 零检测！
  depth_quantile: 0.5        # 抓取点深度分位（0.5≈物心，reBot 出厂值）
  top_depth_quantile: 0.15   # top_down 用：取物体区域最近 15% 深度当顶面（透明瓶/托盘红外穿透会读远）
  support_z_m: 0.0          # top_down 用：物体所在支撑面在基座系的高度（底座与桌面同面=0）；中线不低于它+半爪宽
  approach: top_down         # top_down=竖直向下进给、爪夹物体水平短边（躺放物体）；camera_ray=沿相机视线进给
  open_axis: "y"             # 爪开合轴在 SDK TCP 系的方向：y 或 z（首抓 90° 错位则换）
  final_motion: "linear"     # 末段及原路退出：linear=move_l；joint=关节插补
  linear_vel_mps: 0.08       # 末段期望平均 TCP 速度（米/秒）
  linear_acc_mps2: 0.25      # 末段 TCP 加速度参数（米/秒²）
  j5_margin_deg: 5.0         # 候选 IK 在 J5 两端各留 5°，即 |J5| <= 85°
  pregrasp_offset_m: 0.05    # 预抓取点沿选定进给方向后退 5 cm
  grasp_vel_dps: 30.0        # 抓取运动速度（低速保安全）
  wait_before_grip_s: 0.5    # 到位后等待时长再闭爪
  gripper_open_mm: 65.0      # 张口（行程 4~70mm；目标物 ~6cm 宽需全开）
  gripper_close_factor: 0.7  # 只决定闭合到哪为止的上限（实测爪宽×系数）；
                             #   夹住后锁在停住角（close_and_lock），不顶着物体保持
  gripper_close_min_mm: 15.0 # 闭口下限（防测量偏小时对刚性物硬闭堵转）
  grasp_offset_m: 0.040      # TCP 沿进给方向停在抓取点外多远：SDK 的 TCP 在两指根部（d1t.json），指尖再伸出 50 mm（实测）；
                             #   0.040 = 指尖越过抓取点约 1 cm、指垫夹在物体中线。到位太深调大，太浅调小
  base_offset_m: [0.0, 0.0, 0.0]  # 抓取点固定偏差补偿（基座系 x 前 / y 左 / z 上，米）：实测抓偏 = 实际物体 − 程序给的位置，
                             #   填这个差；同一方向反复偏同样多才填，偏差忽大忽小先重标定（见 README「复刻时抓偏怎么调」）
  min_base_z_m: 0.02         # 目标基座系 z 下限=工作面高度+余量（防砸台面）
                             #   底座与桌面同面时物体天然在 z 0~4cm，勿设过高
