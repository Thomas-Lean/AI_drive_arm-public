# d1t_sdk 打包配置。只支持可编辑安装：pip install -e sdk
# （臂参数 arm_model/ 在包目录之外，d1t_sdk/_arm_model.py 按源码相对路径读取。）
# 版本号唯一来源：d1t_sdk/__init__.py 的 __version__。

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "d1t-sdk"
dynamic = ["version"]
description = "D1-T 七轴舵机臂上位机 SDK：FK/IK、关节/直线规划、20 Hz 关节流式，DDS 直连臂载控制器 d1t_arm_ctrl"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "cyclonedds==0.10.2",  # 必须与臂上 Cyclone DDS 0.10.2 一致
]

[tool.setuptools.dynamic]
version = {attr = "d1t_sdk.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["d1t_sdk*"]
